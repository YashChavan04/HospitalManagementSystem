spring.application.name=HospitalManagementSystem

# ===== Database (MySQL) =====
# Create the database first:  CREATE DATABASE hospitalmanagement;
spring.datasource.url=jdbc:mysql://localhost:3306/hospitalmanagement
spring.datasource.username=root
spring.datasource.password=yash@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Change this secret before any real deployment. Must be >= 32 chars for HS256.
jwt.secret=hospitalManagementSecretKeyChangeMe1234567890
jwt.expiration-ms=3600000

# ===== Default admin bootstrap =====
# A default admin user is created on first startup if it doesn't already exist.
app.bootstrap.admin-username=admin
app.bootstrap.admin-password=admin123

# ===== CORS =====
# Origin(s) allowed to call the API from the frontend (comma separated)
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:63342
